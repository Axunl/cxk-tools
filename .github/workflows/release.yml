# 发版：推送 v* tag（或手动指定 tag）后自动出三平台产物并创建 GitHub Release。
#
# 产物（命名是更新器的契约，改名前先读 AGENTS.md「产物命名」）：
#   cxk-tools-<ver>-windows-x64.zip          便携版
#   cxk-tools-<ver>-windows-x64-setup.exe    Windows 安装器（Inno Setup）
#   cxk-tools-<ver>-macos-<arch>.dmg         macOS 安装包
#   latest.json / SHA256SUMS.txt             更新清单与校验和
#
# 版本号唯一来源是 CMakeLists.txt 的 project(... VERSION ...)：
# prepare 会校验 tag 与它一致，不一致直接失败，绝不在 CI 里偷改源码里的版本。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/重跑的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: version
        name: Check tag matches CMakeLists version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CMAKE_VERSION="$(grep -oP 'project\(cxk-tools\s+VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)"
          echo "tag=$TAG version=$VERSION cmake=$CMAKE_VERSION"
          if [ -z "$CMAKE_VERSION" ]; then
            echo "::error::CMakeLists.txt 里找不到 project(... VERSION ...)"
            exit 1
          fi
          if [ "$VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::tag 是 $TAG，但 CMakeLists.txt 的版本是 $CMAKE_VERSION。先把版本号改成一致再打 tag。"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: windows-x64
    needs: prepare
    runs-on: windows-2022
    # 代码签名走 secret：没配就照常出包（只多一条 ::warning），配上就自动生效，
    # 以后补证书不需要改工作流。证书内容只进环境变量，不出现在任何命令行参数里
    # （runner 上的其它进程能看到命令行，日志里也会原样打印）。
    env:
      WIN_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
      XTOOLS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      WIN_HAS_CERT: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' }}
      XTOOLS_REQUIRE_SIGNING: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      # 固定 6.7.4：installer/windows/lang/ChineseSimplified.isl 是 6.5.0+ 的翻译，
      # 用 7.x 编译会因消息表变动失败。
      # 装到 RUNNER_TEMP 下的固定目录，这样 ISCC 的路径是确定的、不用猜安装位置；
      # 找不到就直接这一步失败 —— 不能等到打包脚本里才发现没有安装器。
      - name: Install Inno Setup 6.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -Wait -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          )
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) {
            # 自定义 /DIR 没生效时再退回到几个常见位置找一遍
            $iscc = @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'ISCC.exe not found after installing Inno Setup 6.7.4'
          }
          Write-Host "ISCC=$iscc"
          # package.bat 会优先用这个环境变量，避免再去猜路径
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # 发布包必须带 PP-OCR 能力：先拉 ONNX Runtime（失败则让本步骤失败，
      # 不发一个「OCR 回落系统 OCR」的残缺版本），package.bat 会自动探测
      # build/_third_party 并传给 -DONNXRUNTIME_ROOT。
      - name: Fetch ONNX Runtime (required for PP-OCR)
        shell: bash
        run: python scripts/fetch-onnxruntime.py

      # 证书以 base64 存进 secret（PFX 是二进制，secret 只能放文本）。这里解到
      # RUNNER_TEMP 并交给 package.bat 的签名步骤；scripts/sign-windows.ps1 会把它
      # 导入当前用户的证书库、按指纹签名、结束时删掉证书与临时文件。
      - name: Prepare signing certificate
        if: env.WIN_HAS_CERT == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cxk-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_SIGN_PFX_BASE64))
          "XTOOLS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          Write-Host "signing certificate staged at $pfx"

      # 没配证书不阻塞发布（本地开发、fork 的 PR 都拿不到 secret），但必须留下
      # 一条注解，免得「发了个未签名的包」这件事悄无声息地过去。
      - name: Warn about unsigned build
        if: env.WIN_HAS_CERT != 'true'
        shell: bash
        run: echo "::warning::WINDOWS_SIGN_PFX_BASE64 未配置，本次产物未签名（SmartScreen 会拦）"

      - name: Build and package
        shell: cmd
        env:
          # 强制要求出安装器：ISCC 缺失时让本步骤失败，而不是发一个没有 setup.exe 的版本
          XTOOLS_REQUIRE_INSTALLER: "1"
        run: scripts\package.bat

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\release | Out-Null
          $v = (Get-Content build\xtools-version.txt).Trim()
          Get-ChildItem dist -Filter "cxk-tools-$v-windows-x64*" -File | Copy-Item -Destination dist\release
          Get-ChildItem dist\release | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macos-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 是 Apple Silicon（arm64）；macos-14 已于 2026-11-02 下线，
          # 用它会分配不到机器（configuration not supported）。
          # Intel 包首轮先不做（清单里缺该平台时客户端会退化到打开发布页）
          - os: macos-15
            arch: arm64
    # 签名 / 公证同样走 secret，缺失时只告警不阻塞（见 windows 任务的说明）。
    env:
      MAC_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
      MAC_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
      XTOOLS_APPLE_ID: ${{ secrets.APPLE_ID }}
      XTOOLS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      XTOOLS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MAC_HAS_CERT: ${{ secrets.MACOS_SIGN_P12_BASE64 != '' }}
      XTOOLS_REQUIRE_NOTARIZATION: ${{ secrets.MACOS_SIGN_P12_BASE64 != '' && secrets.APPLE_APP_PASSWORD != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: clang_64
          cache: true

      # 建一个独立钥匙串并把 .p12 导进去：runner 的登录钥匙串不保证能拿到
      # codesign 的访问权限，且这样删除时不会影响系统其它证书。
      # set-key-partition-list 是必须的 —— 少了它 codesign 会卡在
      # "User interaction is not allowed" 上。
      - name: Import Developer ID certificate
        if: env.MAC_HAS_CERT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cxk-signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          echo -n "$MAC_SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$ID" ]; then
            echo "::error::P12 里没有 Developer ID Application 身份（是不是导出成了 Apple Distribution？）"
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "XTOOLS_MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sign.p12"
          echo "signing as: $ID"

      # notarytool 的凭据存成 keychain profile，后面的提交命令只引用 profile 名，
      # 密码不会出现在任何命令行与日志里。
      - name: Store notarization credentials
        if: env.MAC_HAS_CERT == 'true' && env.XTOOLS_APPLE_ID != '' && env.XTOOLS_APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "cxk-notary" \
            --apple-id "$XTOOLS_APPLE_ID" \
            --password "$XTOOLS_APPLE_APP_PASSWORD" \
            --team-id "$XTOOLS_APPLE_TEAM_ID"
          echo "XTOOLS_NOTARY_PROFILE=cxk-notary" >> "$GITHUB_ENV"

      - name: Warn about unsigned build
        if: env.MAC_HAS_CERT != 'true'
        shell: bash
        run: echo "::warning::MACOS_SIGN_P12_BASE64 未配置，本次 .app 只有 ad-hoc 签名、不公证（Gatekeeper 会拦）"

      # 用 `bash scripts/xxx` 而不是 `./scripts/xxx`：仓库在 Windows 上开发，core.fileMode
      # 常常是 false，脚本很容易以 100644 提交（没有可执行位），checkout 到 runner 上就是
      # ./scripts/build.sh: Permission denied。显式走 bash 就不依赖权限位。
      - name: Build
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/build.sh Release

      - name: Package dmg
        env:
          MACDEPLOYQT: ${{ env.QT_ROOT_DIR }}/bin/macdeployqt
        run: bash scripts/package-macos.sh build dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      # 私钥不能留在 runner 上（临时机器，但失败重试时会复用同一台）。
      - name: Delete signing keychain
        if: always() && env.MAC_HAS_CERT == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/cxk-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sign.p12"

  release:
    name: publish
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 汇总所有产物到 dist/ 根：latest.json 生成脚本只扫顶层文件
      - name: Gather artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f -exec cp -v {} dist/ \;
          ls -la dist

      - name: Build release notes from git log
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            {
              echo "自 ${PREV} 以来的变更："
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            } > release-notes.md
          else
            {
              echo "首个版本。"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${TAG}"
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Generate latest.json + SHA256SUMS.txt
        shell: bash
        run: |
          python3 scripts/gen-release-manifest.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --dir dist --out dist \
            --notes release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          # 重跑同一个 tag 时 release 已经存在：改成覆盖上传，而不是让整个任务失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "CXK 工具箱 ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --title "CXK 工具箱 ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
