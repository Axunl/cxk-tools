# 编译校验：三平台都要能编过（AGENTS.md 规则 3）。
#
# 这里只做「配置 + 编译」，不打包、不发版 —— 打包与发版在 release.yml 里。
# 之所以单开一个工作流：发版流程慢且要写权限，任何一个 PR 都不该触发它。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macos
            # 必须用 macos-15 / macos-26（两者都是 arm64）。macos-14 镜像已于 2026-11-02
            # 从 GitHub Actions 下线：标签还在，但任务分配不到机器，报
            # "The configuration 'macos-14-arm64-us-default' is not supported"，
            # 表现为 job 一步都没跑就被 cancelled。
            # 固定 15 而不是 macos-latest：latest 现在是 macOS 26，Qt 6.8.3 配 Xcode 26 未验证。
            os: macos-15
            qt_arch: clang_64
          - name: linux
            os: ubuntu-22.04
            qt_arch: linux_gcc_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: ${{ matrix.qt_arch }}
          cache: true

      # Linux 全局热键走 X11：缺开发包会直接 configure 失败（见 README 环境要求）
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev libgl1-mesa-dev ninja-build

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows 拉取 ONNX Runtime，让 OCR 的 PP-OCR 分支真正参与编译（而非只编
      # 桩）。这一步失败不致命：FindOnnxruntime 找不到时 ocr 插件自动回落系统 OCR，
      # 纯编译校验仍能过；但成功时能覆盖 OcrOnnx.cpp 的编译错误，价值更大。
      - name: Fetch ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/fetch-onnxruntime.py || echo "[warn] onnxruntime fetch failed, OCR falls back to system OCR"

      - name: Configure
        shell: bash
        run: |
          ONNX_ARGS=""
          if [ -d "build/_third_party/onnxruntime-win-x64/include" ]; then
            ONNX_ARGS="-DOnnxruntime_ROOT=$(pwd)/build/_third_party/onnxruntime-win-x64"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            $ONNX_ARGS

      - name: Build
        shell: bash
        run: cmake --build build --parallel 4

      - name: Summary
        shell: bash
        run: |
          echo "version=$(cat build/xtools-version.txt)"
          ls build/bin
          ls build/bin/plugins | wc -l
